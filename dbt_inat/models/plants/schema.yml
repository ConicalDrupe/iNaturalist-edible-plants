---
version: 1

models:
  - name: observations
    columns:
      - name: gbifid
        data_type: bigint
        constraints:
          - type: primary_key

  - name: species_lookup
    columns:
      - name: taxon_key
        data_type: bigint
        constraints:
          - type: primary_key
      - name: scientific_name
        data_type: varchar(128)
        tests:
          - not_null
